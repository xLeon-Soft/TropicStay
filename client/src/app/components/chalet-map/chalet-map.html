<div class="chalet-map-wrapper" [style.height]="height">
  <div #mapContainer class="leaflet-map-host"></div>
  
  <!-- Floating top map controls -->
  <div class="map-floating-controls">
    <button type="button" class="map-ctrl-btn" (click)="recenter()" title="Enfocar todo el mapa nacional de Guatemala">
      <i class="fa-solid fa-map"></i> Ver toda Guatemala
    </button>

    @if (activeRouteInfo) {
      <button type="button" class="map-ctrl-btn btn-route-toggle" (click)="fitRoute()" title="Enfocar el recorrido completo">
        <i class="fa-solid fa-route"></i> Enfocar ruta
      </button>
    }
  </div>

  <!-- Loading Route Indicator -->
  @if (isLoadingRoute) {
    <div class="route-loading-pill animate-fade">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <span>Calculando ruta por carretera...</span>
    </div>
  }

  <!-- Active Route Bottom Card -->
  @if (activeRouteInfo) {
    <div class="active-route-banner glass-panel animate-fade">
      <div class="route-banner-icon">
        <i class="fa-solid fa-car-side"></i>
      </div>
      <div class="route-banner-info">
        <div class="route-banner-title">
          <span class="route-dest-tag">Ruta hacia:</span>
          <strong>{{ activeRouteInfo.chaletTitle }}</strong>
        </div>
        <div class="route-banner-stats">
          <span class="stat-chip"><i class="fa-solid fa-route"></i> {{ activeRouteInfo.distanceKm }} km</span>
          <span class="stat-chip"><i class="fa-solid fa-clock"></i> ~{{ activeRouteInfo.durationFormatted }}</span>
          <span class="stat-origin">desde {{ activeRouteInfo.originName }}</span>
        </div>
      </div>
      <div class="route-banner-actions">
        <button type="button" class="btn-route-action" (click)="fitRoute()" title="Enfocar ruta">
          <i class="fa-solid fa-expand"></i>
        </button>
        <button type="button" class="btn-route-action btn-close-route" (click)="clearRoute()" title="Quitar trazo de ruta">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
  }
</div>
