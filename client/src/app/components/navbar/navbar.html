<header class="navbar-header">
  <div class="container navbar-container">
    <!-- Brand Logo -->
    <a routerLink="/" class="navbar-brand" title="TropicStay Guatemala - Alquiler de Chalets">
      <img src="logo.png" alt="TropicStay Guatemala Vacation Rentals" class="brand-logo-img" />
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <span>Inicio</span>
      </a>
      <a routerLink="/explore" routerLinkActive="active" class="nav-item">
        <span>Explorar</span>
      </a>
      <a routerLink="/messages" routerLinkActive="active" class="nav-item">
        <span>Mensajes</span>
      </a>
    </nav>

    <!-- Right Actions -->
    <div class="navbar-actions">
      <!-- Currency Switcher -->
      <button class="currency-toggle" (click)="toggleCurrency()" title="Cambiar moneda">
        <span class="currency-flag">{{ chaletService.currency() === 'GTQ' ? '🇬🇹' : '🇺🇸' }}</span>
        <span class="currency-code">{{ chaletService.currency() }}</span>
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>

      <!-- Publish Chalet CTA -->
      <a routerLink="/publish" class="btn-publish">
        <i class="fa-solid fa-plus-circle"></i>
        <span>Publicar Chalet</span>
      </a>

      <!-- Favorites link -->
      <a routerLink="/explore" [queryParams]="{favorites: 'true'}" class="btn-favorites" title="Mis Chalets Favoritos">
        <i class="fa-solid fa-heart"></i>
        @if (chaletService.favorites().length > 0) {
          <span class="fav-count">{{ chaletService.favorites().length }}</span>
        }
      </a>

      <button class="user-menu" (click)="logout()" title="Cerrar sesión">
        @if (auth.user()?.picture) {
          <img [src]="auth.user()?.picture" [alt]="auth.user()?.name">
        } @else {
          <i class="fa-solid fa-user"></i>
        }
        <span>{{ auth.user()?.name?.split(' ')?.[0] }}</span>
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>

      <!-- Mobile Hamburger Button -->
      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Abrir menú">
        <i class="fa-solid" [class.fa-bars]="!isMenuOpen" [class.fa-xmark]="isMenuOpen"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  @if (isMenuOpen) {
    <div class="mobile-nav animate-fade">
      <a routerLink="/" (click)="toggleMenu()" class="mobile-nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Inicio</span>
      </a>
      <a routerLink="/explore" (click)="toggleMenu()" class="mobile-nav-item">
        <i class="fa-solid fa-compass"></i>
        <span>Explorar Chalets de Guatemala</span>
      </a>
      <a routerLink="/messages" (click)="toggleMenu()" class="mobile-nav-item">
        <i class="fa-solid fa-comments"></i>
        <span>Mensajes</span>
      </a>
      <a routerLink="/explore" [queryParams]="{favorites: 'true'}" (click)="toggleMenu()" class="mobile-nav-item">
        <i class="fa-solid fa-heart text-danger"></i>
        <span>Mis Favoritos ({{ chaletService.favorites().length }})</span>
      </a>
      <a routerLink="/publish" (click)="toggleMenu()" class="mobile-nav-item publish-highlight">
        <i class="fa-solid fa-plus-circle"></i>
        <span>Publicar mi Chalet</span>
      </a>
      <button type="button" (click)="logout()" class="mobile-nav-item mobile-logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Cerrar sesión</span>
      </button>
      <div class="mobile-currency-row">
        <span>Moneda activa:</span>
        <button class="currency-toggle" (click)="toggleCurrency()">
          <span>{{ chaletService.currency() === 'GTQ' ? '🇬🇹' : '🇺🇸' }} {{ chaletService.currency() }}</span>
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </div>
  }
</header>
